# filepath: .github/workflows/release.yml
# package:  n/a (repository root)
# since:    v0.6.0
# purpose:  The ApiPilot release pipeline. Builds, tests, emits an SBOM,
#           signs the packages when a certificate is configured, records
#           provenance, creates a GitHub Release, and uploads artifacts.

name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  build-and-test:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne "v$version") {
            Write-Error "Tag $tag does not match VERSION v$version"
            exit 1
          }
          Write-Host "Tag $tag matches VERSION v$version"

      - name: Build the solution
        run: dotnet build dotnet/ApiPilot.slnx -c Release --nologo

      - name: Run Core tests
        run: dotnet run --project dotnet/tests/ApiPilot.Core.Tests/ApiPilot.Core.Tests.csproj -c Release --no-build

      - name: Run AspNetCore tests
        run: dotnet run --project dotnet/tests/ApiPilot.AspNetCore.Tests/ApiPilot.AspNetCore.Tests.csproj -c Release --no-build

      - name: Run Security tests
        run: dotnet run --project dotnet/tests/ApiPilot.Security.Tests/ApiPilot.Security.Tests.csproj -c Release --no-build

      - name: Run Contract tests
        run: dotnet run --project dotnet/tests/ApiPilot.ContractTests/ApiPilot.ContractTests.csproj -c Release --no-build

      - name: Run Fuzz tests
        run: dotnet run --project dotnet/tests/ApiPilot.FuzzTests/ApiPilot.FuzzTests.csproj -c Release --no-build

      - name: Run Browser tests
        run: dotnet run --project dotnet/tests/ApiPilot.BrowserTests/ApiPilot.BrowserTests.csproj -c Release --no-build -- --allow-skip

  sign-and-package:
    name: Sign, package, and release
    runs-on: windows-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack the packages
        run: dotnet pack dotnet/ApiPilot.slnx -c Release -o artifacts/packages --nologo

      - name: Restore the signing certificate (optional)
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          NUGET_SIGNING_CERT_BASE64: ${{ secrets.NUGET_SIGNING_CERT_BASE64 }}
        run: |
          $pfx = [System.Convert]::FromBase64String($env:NUGET_SIGNING_CERT_BASE64)
          $certPath = Join-Path $env:RUNNER_TEMP 'apipilot-signing.pfx'
          [System.IO.File]::WriteAllBytes($certPath, $pfx)
          Write-Host ('Certificate written to ' + $certPath)
          Write-Host ('CERT_PATH=' + $certPath) >> $env:GITHUB_ENV

      - name: Sign the packages (optional)
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        env:
          NUGET_SIGNING_CERT_PASSWORD: ${{ secrets.NUGET_SIGNING_CERT_PASSWORD }}
        run: |
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget sign $_.FullName --certificate-path $env:CERT_PATH --certificate-password $env:NUGET_SIGNING_CERT_PASSWORD --timestamper http://timestamp.digicert.com --overwrite
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Note signing status
        if: ${{ secrets.NUGET_SIGNING_CERT_BASE64 == '' }}
        shell: pwsh
        run: Write-Host 'No signing certificate configured. Packages will be published unsigned (NuGet adds a repository signature on push).'

      - name: Generate the SBOM
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/generate-sbom.ps1

      - name: Record provenance
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $runUrl = $env:GITHUB_SERVER_URL + '/' + $env:GITHUB_REPOSITORY + '/actions/runs/' + $env:GITHUB_RUN_ID
          $provenance = [ordered]@{
            version    = $version
            commit     = $env:GITHUB_SHA
            runId      = $env:GITHUB_RUN_ID
            runUrl     = $runUrl
            repository = $env:GITHUB_REPOSITORY
            builtAt    = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          }
          $dir = Join-Path 'artifacts' 'provenance'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $json = $provenance | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText((Join-Path $dir 'provenance.json'), $json, [System.Text.UTF8Encoding]::new($false))
          Write-Host 'Provenance written.'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apipilot-release
          path: |
            artifacts/packages/*.nupkg
            artifacts/sbom/*.spdx.json
            artifacts/provenance/provenance.json

      - name: NuGet login (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: sancy

      - name: Push to NuGet
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            Write-Host ("Pushing " + $_.Name)
            dotnet nuget push $_.FullName --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/packages/*.nupkg
            artifacts/sbom/*.spdx.json
            artifacts/provenance/provenance.json
          generate_release_notes: true
